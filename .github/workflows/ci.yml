name: CI Pipeline

on:
  push:
    branches: [ main, master, namnv ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gotek_migrator
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: gotek_chatbot
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install System Dependencies & Setup Postgres Socket Bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y socat postgresql-client psmisc
          
          # Bridge Unix domain socket /tmp/.s.PGSQL.55432 to PostgreSQL dynamic host TCP port
          socat UNIX-LISTEN:/tmp/.s.PGSQL.55432,fork,reuseaddr,mode=777 TCP:127.0.0.1:${{ job.services.postgres.ports[5432] }} &
          
          # Bridge TCP 127.0.0.1:55432 to PostgreSQL dynamic host TCP port for test suites connecting via TCP
          sudo fuser -k 55432/tcp 2>/dev/null || true
          socat TCP4-LISTEN:55432,bind=127.0.0.1,fork,reuseaddr TCP:127.0.0.1:${{ job.services.postgres.ports[5432] }} &
          
          # Wait for PostgreSQL to be ready on both Unix socket and TCP port 55432
          for i in {1..30}; do
            if pg_isready -h /tmp -p 55432 -U gotek_migrator && pg_isready -h 127.0.0.1 -p 55432 -U gotek_migrator; then
              echo "PostgreSQL Unix socket and TCP port 55432 are ready and accepting connections!"
              break
            fi
            echo "Waiting for PostgreSQL connections..."
            sleep 1
          done

      - name: Install Monorepo Dependencies
        run: npm run install:all

      - name: Setup Database & Run Migrations
        run: npm run db:setup
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGUSER: gotek_migrator
          PGPASSWORD: ci_password
          GOTEK_DB_ADMIN_PASSWORD: ci_password
          PGDATABASE: postgres

      - name: Backend Typecheck & Tests
        run: |
          npm run --prefix backend build
          npm run --prefix backend test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_NAME: gotek_chatbot
          DB_USER: gotek_app
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGUSER: gotek_migrator
          PGPASSWORD: ci_password
          GOTEK_DB_ADMIN_PASSWORD: ci_password
          PGDATABASE: gotek_chatbot
          GOTEK_DEFAULT_AI_RESPONSE_QUOTA: 1000
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: ${{ job.services.redis.ports[6379] }}

      - name: Frontend Typecheck & Build
        run: |
          npm run --prefix frontend build
          npm run --prefix frontend test
