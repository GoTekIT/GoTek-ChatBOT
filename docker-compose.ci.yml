version: '3.8'

services:
  postgres-ci:
    image: postgres:16-alpine
    container_name: gotek-ci-postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: gotek_migrator
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: gotek_chatbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotek_migrator -d gotek_chatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gotek-ci-network

  redis-ci:
    image: redis:7-alpine
    container_name: gotek-ci-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gotek-ci-network

networks:
  gotek-ci-network:
    name: gotek_ci_network
    driver: bridge
