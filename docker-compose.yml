version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gotek-postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: gotek_migrator
      POSTGRES_PASSWORD: gotek_dev_password
      POSTGRES_DB: gotek_chatbot
    volumes:
      - gotek_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotek_migrator -d gotek_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotek-network

  redis:
    image: redis:7-alpine
    container_name: gotek-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gotek_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotek-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gotek-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP broker port
      - "15672:15672"   # Management Web UI (guest:guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - gotek_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotek-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gotek-backend
    restart: unless-stopped
    ports:
      - "4317:4317"
    environment:
      NODE_ENV: development
      PORT: 4317
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://gotek_migrator:gotek_dev_password@postgres:5432/gotek_chatbot
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gotek-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gotek-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - gotek-network

networks:
  gotek-network:
    name: gotek_network
    driver: bridge

volumes:
  gotek_postgres_data:
  gotek_redis_data:
  gotek_rabbitmq_data:
