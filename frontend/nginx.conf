server {
    listen 80;
    server_name localhost;

    # Stream access & error logs directly to Docker console stdout/stderr
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4317/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /widget-api/ {
        proxy_pass http://backend:4317/widget-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/(widget\.js|sdk\.js) {
        proxy_pass http://backend:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://backend:4317/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
